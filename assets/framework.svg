<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">IntuitionEDU conceptual workflow</title>
<desc id="desc">Human direction defines a brief. Scoped agent work produces artifacts for review and revision, followed by a human decision. Candidate lessons can enter memory and skills, then be tested in later work. The figure describes an intended framework, not an empirically validated learning loop.</desc>
<rect width="1120" height="450" rx="12" fill="#f5f4ef"/>
<text x="40" y="45" font-family="Arial,sans-serif" font-size="15" fill="#275b48" letter-spacing="2">INTUITIONEDU / CONCEPTUAL FRAMEWORK</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6d8372"/></marker></defs>
<g fill="none" stroke="#6d8372" stroke-width="2" marker-end="url(#arrow)"><path d="M228 158H269"/><path d="M475 158H516"/><path d="M722 158H763"/><path d="M868 201V277H620"/><path d="M416 314H312V209" stroke-dasharray="5 5"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="40" y="103" width="188" height="106" rx="6" fill="#275b48"/><text x="134" y="142" font-size="19" fill="white">Human brief</text><text x="134" y="169" font-size="13" fill="#dae7d8">Purpose · scope · authority</text>
<rect x="278" y="103" width="197" height="106" rx="6" fill="#e3eade" stroke="#b7c5b5"/><text x="376" y="142" font-size="19" fill="#263c2e">Scoped agent work</text><text x="376" y="169" font-size="13" fill="#586b5b">Named roles · inspectable files</text>
<rect x="525" y="103" width="197" height="106" rx="6" fill="#e3eade" stroke="#b7c5b5"/><text x="623" y="142" font-size="19" fill="#263c2e">Review &amp; revision</text><text x="623" y="169" font-size="13" fill="#586b5b">Evidence · dissent · correction</text>
<rect x="772" y="103" width="197" height="106" rx="6" fill="#275b48"/><text x="870" y="142" font-size="19" fill="white">Human decision</text><text x="870" y="169" font-size="13" fill="#dae7d8">Accept · revise · reject · defer</text>
<rect x="416" y="277" width="267" height="75" rx="6" fill="#f0e4cf" stroke="#d4bd98"/><text x="550" y="306" font-size="17" fill="#614d30">Candidate lessons</text><text x="550" y="331" font-size="13" fill="#715d3f">Memory · skills · later evaluation</text>
</g><text x="40" y="402" font-family="Arial,sans-serif" font-size="14" fill="#596c5e">Retention makes a lesson available. Later outcomes must show whether it helped.</text>
<text x="40" y="427" font-family="Arial,sans-serif" font-size="11" fill="#758372">Conceptual diagram · CC BY 4.0 · IntuitionEDU contributors</text>
</svg>
